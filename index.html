<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashRate Watch</title>
<meta name="description" content="CashRate Watch: weekly rankings of where to park your cash. Coming soon.">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f9fb; color: #1d2733; line-height: 1.5; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .card { max-width: 36rem; text-align: center; }
  h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.02em; color: #0f5132; }
  p { margin: 0; font-size: clamp(1.05rem, 3.5vw, 1.25rem); }
  footer { text-align: center; padding: 1.25rem; font-size: .85rem; color: #6b7785; }
  @media (prefers-color-scheme: dark) {
    body { background: #11161c; color: #e6edf3; }
    h1 { color: #5fd3a0; }
    footer { color: #8b98a5; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>CashRate Watch</h1>
    <p>CashRate Watch: weekly rankings of where to park your cash. Coming soon.</p>
  </div>
</main>
<footer>A Sparta Labs site</footer>
</body>
</html>
